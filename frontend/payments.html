<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments – Turf-Ballers</title>
  <meta name="description" content="Track and manage turf booking payments – cash, UPI, card and net banking."/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚽</div><div><h1>Turf-Ballers</h1><p>Management System</p></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a class="nav-item" href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="members.html"><span class="nav-icon">👥</span> Members</a>
      <a class="nav-item" href="bookings.html"><span class="nav-icon">📅</span> Bookings</a>
      <a class="nav-item" href="payments.html"><span class="nav-icon">💳</span> Payments</a>
      <a class="nav-item" href="attendance.html"><span class="nav-icon">✅</span> Attendance</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="avatar" id="sidebarAvatar">A</div><div class="user-info"><div class="name" id="sidebarUserName">Admin</div><div class="role" id="sidebarUserRole">Administrator</div></div></div>
      <button class="btn btn-secondary btn-sm w-full mt-16" id="logoutBtn" style="justify-content:center">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h2>Payments</h2><p id="paymentSummary">Loading...</p></div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="addPaymentBtn">➕ Record Payment</button>
        <button class="btn btn-icon btn-secondary" id="menuToggle">☰</button>
      </div>
    </header>

    <div class="page-body">
      <!-- Summary cards -->
      <div class="stats-grid mb-24" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card"><div class="stat-icon green">💰</div><div class="stat-info"><div class="stat-label">Total Collected</div><div class="stat-value" id="totalCollected">—</div></div></div>
        <div class="stat-card"><div class="stat-icon orange">⏳</div><div class="stat-info"><div class="stat-label">Pending Amount</div><div class="stat-value" id="totalPending">—</div></div></div>
        <div class="stat-card"><div class="stat-icon blue">📋</div><div class="stat-info"><div class="stat-label">Total Transactions</div><div class="stat-value" id="totalTx">—</div></div></div>
      </div>

      <div class="table-toolbar">
        <div class="input-group"><span class="input-icon">🔍</span><input class="form-control" type="text" id="searchInput" placeholder="Search member or transaction ref…"/></div>
        <div class="filter-group">
          <select class="form-control" id="statusFilter" style="min-width:140px">
            <option value="">All Status</option>
            <option value="PAID">Paid</option>
            <option value="PENDING">Pending</option>
            <option value="FAILED">Failed</option>
          </select>
          <select class="form-control" id="methodFilter" style="min-width:140px">
            <option value="">All Methods</option>
            <option value="CASH">Cash</option>
            <option value="UPI">UPI</option>
            <option value="CARD">Card</option>
            <option value="NET_BANKING">Net Banking</option>
          </select>
        </div>
      </div>

      <div class="table-container card">
        <table>
          <thead><tr><th>#</th><th>Member</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction Ref</th><th>Date</th></tr></thead>
          <tbody id="paymentsBody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- RECORD PAYMENT MODAL -->
<div class="modal-overlay" id="paymentModal">
  <div class="modal">
    <div class="modal-header"><h3>Record Payment</h3><button class="modal-close" onclick="closeModal('paymentModal')">✕</button></div>
    <div class="modal-body">
      <form id="paymentForm">
        <div class="form-group"><label class="form-label">Member *</label>
          <select class="form-control" id="pMember" required><option value="">Select member…</option></select>
        </div>
        <div class="form-group"><label class="form-label">Booking (optional)</label>
          <select class="form-control" id="pBooking"><option value="">No linked booking</option></select>
        </div>
        <div class="grid-2">
          <div class="form-group"><label class="form-label">Amount (₹) *</label><input class="form-control" type="number" id="pAmount" required min="1" placeholder="800"/></div>
          <div class="form-group"><label class="form-label">Payment Method *</label>
            <select class="form-control" id="pMethod" required>
              <option value="CASH">💵 Cash</option>
              <option value="UPI">📱 UPI</option>
              <option value="CARD">💳 Card</option>
              <option value="NET_BANKING">🏦 Net Banking</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label class="form-label">Status</label>
            <select class="form-control" id="pStatus">
              <option value="PAID">Paid</option>
              <option value="PENDING">Pending</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Transaction Ref</label><input class="form-control" id="pRef" placeholder="UPI-2024-001"/></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('paymentModal')">Cancel</button>
      <button class="btn btn-primary" id="savePaymentBtn">💾 Record</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!Auth.requireAuth()) {}
initSidebar();

let allPayments = [], allMembers = [];

async function loadMembers() {
  try {
    const data = await API.members.getAll({ size: 200 });
    allMembers = data.content || data || [];
    const sel = document.getElementById('pMember');
    sel.innerHTML = '<option value="">Select member…</option>' +
      allMembers.map(m => `<option value="${m.id}">${m.fullName}</option>`).join('');
  } catch(e) { console.error('Error loading members', e); }
}

async function loadPayments() {
  try {
    const data = await API.payments.getAll({ size: 500, sort: 'createdAt,desc' });
    allPayments = data.content || data || [];

    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const method = document.getElementById('methodFilter').value;

    let filtered = allPayments.filter(p => {
      const matchSearch = !search || (p.memberName||'').toLowerCase().includes(search) || (p.transactionRef||'').toLowerCase().includes(search);
      const matchStatus = !status || p.status === status;
      const matchMethod = !method || p.paymentMethod === method;
      return matchSearch && matchStatus && matchMethod;
    });

    const paid    = filtered.filter(p => p.status === 'PAID').reduce((s,p) => s + (p.amount||0), 0);
    const pending = filtered.filter(p => p.status === 'PENDING').reduce((s,p) => s + (p.amount||0), 0);
    document.getElementById('totalCollected').textContent = formatCurrency(paid);
    document.getElementById('totalPending').textContent   = formatCurrency(pending);
    document.getElementById('totalTx').textContent        = filtered.length;
    document.getElementById('paymentSummary').textContent = `${allPayments.length} transactions total`;

    const tbody = document.getElementById('paymentsBody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">No payments found</td></tr>';
    } else {
      tbody.innerHTML = filtered.map((p, i) => `
        <tr>
          <td class="text-muted">${i+1}</td>
          <td><span class="fw-600">${p.memberName || '—'}</span></td>
          <td class="text-accent fw-600">${formatCurrency(p.amount)}</td>
          <td>${statusBadge(p.paymentMethod)}</td>
          <td>${statusBadge(p.status)}</td>
          <td class="text-muted text-sm">${p.transactionRef || '—'}</td>
          <td class="text-muted">${formatDate(p.paymentDate || p.createdAt)}</td>
        </tr>`).join('');
    }
  } catch(e) { Toast.error('Failed to load payments: ' + e.message); }
}

document.getElementById('pMember').addEventListener('change', async (e) => {
  const memberId = e.target.value;
  const bSelect = document.getElementById('pBooking');
  if (!memberId) {
    bSelect.innerHTML = '<option value="">No linked booking</option>';
    return;
  }
  try {
    const res = await API.bookings.getAll({ memberId: memberId, size: 50 });
    const bks = res.content || res || [];
    bSelect.innerHTML = '<option value="">No linked booking</option>' + 
      bks.map(b => `<option value="${b.id}">${formatDate(b.date)} - ${b.startTime}</option>`).join('');
  } catch (err) {
    console.error(err);
    bSelect.innerHTML = '<option value="">No linked booking</option>';
  }
});

document.getElementById('addPaymentBtn').addEventListener('click', () => {
  document.getElementById('paymentForm').reset();
  openModal('paymentModal');
});

document.getElementById('savePaymentBtn').addEventListener('click', async () => {
  const payload = {
    memberId:      document.getElementById('pMember').value,
    bookingId:     document.getElementById('pBooking').value || null,
    amount:        document.getElementById('pAmount').value,
    paymentMethod: document.getElementById('pMethod').value,
    status:        document.getElementById('pStatus').value,
    transactionRef:document.getElementById('pRef').value.trim() || null,
  };
  if (!payload.memberId || !payload.amount) { Toast.warning('Member and amount are required.'); return; }
  try {
    await API.payments.create(payload);
    Toast.success('Payment recorded!');
    closeModal('paymentModal');
    loadPayments();
  } catch(e) { Toast.error(e.message); }
});

let searchTimeout;
document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(loadPayments, 350); });
document.getElementById('statusFilter').addEventListener('change', loadPayments);
document.getElementById('methodFilter').addEventListener('change', loadPayments);

loadMembers();
loadPayments();
</script>
</body>
</html>
