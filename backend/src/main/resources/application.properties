# =====================================================
# Turf-Ballers Application Configuration
# =====================================================

# Server
server.port=${PORT:8080}

# Application Name
spring.application.name=turfballers-backend

# =====================================================
# Database Configuration
# Switch to MySQL for production by setting env vars:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# =====================================================

# H2 in-memory (default local dev - no setup needed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:turfballers;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# H2 Console (only for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================
# JWT Configuration
# =====================================================
app.jwt.secret=${JWT_SECRET:TurfBallersS3cur3S3cr3tK3yF0rJWTAuth3nt1cat10n2024!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# Multipart (Profile picture upload)
# =====================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.turfballers=INFO
logging.level.org.springframework.security=WARN
